name: Update Ghast Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data

          gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                          contributionLevel
                          color
                          weekday
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login='diptim06' \
            > data/contributions.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Render Ghast animation
        run: python3 ghast/renderer.py

      - name: Save updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json assets/ghast-contributions.gif

          git diff --cached --quiet || \
            git commit -m "Update Ghast contribution animation"

          git push
