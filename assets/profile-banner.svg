<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- =========================
         BACKGROUND
         ========================= -->

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
      <stop offset="0%" stop-color="#020711"/>
      <stop offset="52%" stop-color="#04101C"/>
      <stop offset="100%" stop-color="#061625"/>
    </linearGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#38D9FF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#38D9FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyanLine" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#38D9FF" stop-opacity=".1"/>
      <stop offset="45%" stop-color="#38D9FF"/>
      <stop offset="100%" stop-color="#38D9FF" stop-opacity=".1"/>
    </linearGradient>

    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        stroke="#38D9FF"
        stroke-opacity=".055"
        stroke-width="1"/>

    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- =========================
       BACKGROUND
       ========================= -->

  <rect
    width="1200"
    height="360"
    rx="22"
    fill="url(#bg)"/>

  <rect
    width="1200"
    height="360"
    fill="url(#grid)"/>

  <ellipse
    cx="880"
    cy="175"
    rx="420"
    ry="190"
    fill="url(#cyanGlow)"/>


  <!-- =========================
       OUTER FRAME
       ========================= -->

  <g
    fill="none"
    stroke="#38D9FF"
    stroke-width="1"
    stroke-opacity=".28">

    <path d="M28 22H1172"/>
    <path d="M28 338H1172"/>
    <path d="M28 22V338"/>
    <path d="M1172 22V338"/>

  </g>

  <!-- Corner brackets -->

  <g
    fill="none"
    stroke="#38D9FF"
    stroke-width="2"
    stroke-opacity=".75">

    <path d="M28 48V22H54"/>
    <path d="M1146 22H1172V48"/>
    <path d="M28 312V338H54"/>
    <path d="M1146 338H1172V312"/>

  </g>


  <!-- =========================
       TOP SYSTEM BAR
       ========================= -->

  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">

    <text
      x="72"
      y="56"
      font-size="10"
      letter-spacing="3"
      fill="#7FDFFF">

      [ 01 ] PROFILE.INIT

    </text>

    <text
      x="1060"
      y="56"
      font-size="10"
      letter-spacing="3"
      fill="#7FDFFF">

      [ 2026 ]

    </text>

  </g>


  <!-- =========================
       LEFT TERMINAL / STATUS
       ========================= -->

  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">

    <text
      x="74"
      y="101"
      font-size="11"
      letter-spacing="2.5"
      fill="#647F8A">

      CURRENT PROCESS

    </text>

    <!-- Status rows -->

    <g font-size="13" letter-spacing="3">

      <rect
        x="74"
        y="122"
        width="10"
        height="10"
        rx="2"
        fill="none"
        stroke="#38D9FF"
        stroke-width="1.3"/>

      <text x="96" y="131" fill="#FFFFFF">
        CODE
      </text>


      <rect
        x="74"
        y="157"
        width="10"
        height="10"
        rx="2"
        fill="none"
        stroke="#38D9FF"
        stroke-width="1.3"/>

      <text x="96" y="166" fill="#FFFFFF">
        LEARN
      </text>


      <rect
        x="74"
        y="192"
        width="10"
        height="10"
        rx="2"
        fill="none"
        stroke="#38D9FF"
        stroke-width="1.3"/>

      <text x="96" y="201" fill="#FFFFFF">
        BUILD
      </text>


      <rect
        x="74"
        y="227"
        width="10"
        height="10"
        rx="2"
        fill="none"
        stroke="#38D9FF"
        stroke-width="1.3"/>

      <text x="96" y="236" fill="#FFFFFF">
        SHIP
      </text>

    </g>

  </g>


  <!-- =========================
       LEFT TECH DETAILS
       ========================= -->

  <g
    fill="none"
    stroke="#38D9FF">

    <path
      d="M260 110H470"
      stroke-opacity=".42"/>

    <path
      d="M260 119H395"
      stroke-opacity=".12"/>

    <rect
      x="260"
      y="253"
      width="210"
      height="20"
      rx="3"
      stroke-opacity=".20"/>

    <rect
      x="482"
      y="253"
      width="110"
      height="20"
      rx="3"
      stroke-opacity=".14"/>

    <rect
      x="604"
      y="253"
      width="92"
      height="20"
      rx="3"
      stroke-opacity=".18"/>

  </g>

  <!-- tiny system markers -->

  <g fill="#38D9FF" filter="url(#tinyGlow)">

    <rect x="330" y="107" width="5" height="5"/>
    <rect x="442" y="253" width="5" height="20"/>
    <rect x="578" y="253" width="4" height="20"/>

  </g>


  <!-- Terminal prompt -->

  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">

    <text
      x="72"
      y="307"
      font-size="15"
      letter-spacing="1.2"
      fill="#FFFFFF">

      ~/diptim06

    </text>

    <!-- Blinking cursor -->
    <rect
      x="180"
      y="293"
      width="8"
      height="16"
      fill="#38D9FF"
      filter="url(#tinyGlow)">

      <animate
        attributeName="opacity"
        values="1;0.15;1"
        dur="1.1s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- =========================
       CENTER MICRO-PANEL
       ========================= -->

  <g transform="translate(445 286)">

    <rect
      x="0"
      y="0"
      width="125"
      height="45"
      rx="4"
      fill="#04101A"
      fill-opacity=".9"
      stroke="#38D9FF"
      stroke-opacity=".28"/>

    <text
      x="62.5"
      y="15"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="8"
      letter-spacing="2.2"
      fill="#7FDFFF">

      IDEAS

    </text>

    <text
      x="62.5"
      y="28"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="8"
      letter-spacing="2.2"
      fill="#FFFFFF">

      INTO

    </text>

    <text
      x="62.5"
      y="41"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="8"
      letter-spacing="2.2"
      fill="#FFFFFF">

      REALITY

    </text>

  </g>


  <!-- =========================
       RIGHT IDENTITY PANEL
       ========================= -->

  <g transform="translate(704 76)">

    <rect
      x="0"
      y="0"
      width="410"
      height="224"
      rx="5"
      fill="#03101A"
      fill-opacity=".46"
      stroke="#38D9FF"
      stroke-opacity=".20"/>


    <!-- Header -->

    <text
      x="24"
      y="29"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="9"
      letter-spacing="3.4"
      fill="#7FDFFF">

      DEVELOPER // PROBLEM SOLVER // LIFELONG LEARNER

    </text>


    <!-- Name -->

    <text
      x="24"
      y="96"
      font-family="Arial, Helvetica, sans-serif"
      font-size="46"
      font-weight="700"
      letter-spacing="7"
      fill="#FFFFFF">

      DIPTI

    </text>

    <text
      x="24"
      y="146"
      font-family="Arial, Helvetica, sans-serif"
      font-size="46"
      font-weight="700"
      letter-spacing="7"
      fill="#38D9FF"
      filter="url(#tinyGlow)">

      MISHRA

    </text>


    <!-- Divider -->

    <rect
      x="24"
      y="164"
      width="360"
      height="1.5"
      rx="1"
      fill="url(#cyanLine)"/>


    <!-- Motto -->

    <text
      x="24"
      y="193"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      letter-spacing="3.6"
      fill="#FFFFFF">

      LEARNING

    </text>

    <text
      x="141"
      y="193"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      fill="#38D9FF">

      /

    </text>

    <text
      x="166"
      y="193"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      letter-spacing="3.6"
      fill="#FFFFFF">

      BUILDING

    </text>

    <text
      x="289"
      y="193"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      fill="#38D9FF">

      /

    </text>

    <text
      x="314"
      y="193"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11"
      letter-spacing="3.6"
      fill="#FFFFFF">

      SHIPPING

    </text>


    <!-- Bottom status line -->

    <line
      x1="24"
      y1="215"
      x2="384"
      y2="215"
      stroke="#38D9FF"
      stroke-opacity=".14"/>

    <circle
      cx="42"
      cy="215"
      r="3"
      fill="#38D9FF"
      filter="url(#tinyGlow)">

      <animate
        attributeName="opacity"
        values="0.25;1;0.25"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>

    <text
      x="58"
      y="219"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="8"
      letter-spacing="2"
      fill="#7F9EAA">

      BUILD MODE: ACTIVE

    </text>

  </g>


  <!-- =========================
       SMALL HUD DETAILS
       ========================= -->

  <g fill="#38D9FF" filter="url(#tinyGlow)">

    <circle cx="651" cy="88" r="2"/>
    <circle cx="680" cy="279" r="2"/>
    <circle cx="1100" cy="69" r="2"/>
    <circle cx="1110" cy="306" r="2"/>

  </g>

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity=".24"
    stroke-width="1">

    <path d="M625 116H639V129"/>
    <path d="M650 112H637V125"/>
    <path d="M1017 287H1033V271"/>

  </g>

</svg>